name: Build Android APK (Godot)

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Cache Godot toolchain
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          NAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}"

          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip "${BASE}/${NAME}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/${NAME}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          curl -fL -o /tmp/templates.tpz "${BASE}/${NAME}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> $GITHUB_PATH

      - name: Create debug keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -storepass android \
              -keystore ~/.android/debug.keystore \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

      - name: Point Godot at the Android SDK
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project assets
        run: |
          set -euo pipefail
          # The first pass generates .godot/ and imports ~190 textures; it is
          # expected to be noisy. A second pass settles the import cache.
          godot --headless --import . || true
          godot --headless --import .

      - name: Run simulation self-tests
        run: |
          set -euo pipefail
          godot --headless --script res://game/tests/Tests.gd

      - name: UI layout smoke test
        run: |
          set -euo pipefail
          # Boots the real game headless and asserts every screen actually
          # occupies the screen. The simulation tests cannot see layout bugs.
          godot --headless -- --uitest 2>&1 | tee /tmp/ui.log
          if grep -q "SCRIPT ERROR" /tmp/ui.log; then
            echo "::error::script errors while booting the UI"
            exit 1
          fi
          grep -q "UITEST OK" /tmp/ui.log

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --export-debug "Android" build/travian-offline.apk
          ls -lh build/

      - name: Verify the APK is real
        run: |
          set -euo pipefail
          test -s build/travian-offline.apk
          SIZE=$(stat -c%s build/travian-offline.apk)
          echo "APK size: $((SIZE / 1024 / 1024)) MB"
          # A template-only APK with no game data would be far smaller than this.
          test "$SIZE" -gt 5000000
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging build/travian-offline.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travian-offline-apk-${{ github.run_number }}
          path: build/travian-offline.apk
          retention-days: 60

      - name: Attach APK to release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build/travian-offline.apk
