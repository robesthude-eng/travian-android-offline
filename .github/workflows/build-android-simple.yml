name: Build Simple APK (WebView - No Unity License needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildSimple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Build Simple APK
        working-directory: AndroidSimple
        run: |
          echo "GITHUB_RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Travian-Simple-APK-v${{ github.run_number }}
          path: AndroidSimple/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: AndroidSimple/app/build/outputs/apk/debug/*.apk
