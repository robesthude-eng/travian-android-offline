name: Build Android APK (Travian Offline - Unity - Needs License)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: Library-Android-${{ hashFiles('UnityProject/Packages/manifest.json') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build Unity APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          buildsPath: buildAndroid
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          customParameters: -nographics -batchmode
          versioning: Semantic
          unityVersion: 2022.3.20f1

      - name: Upload Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: Travian-Unity-APK-v${{ github.run_number }}
          path: buildAndroid/Android/*.apk
          retention-days: 30
